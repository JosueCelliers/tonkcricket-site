<style>
  /* the link page: one column of big buttons on navy (layout: a centred stack, 440px at most) */
  body { background: var(--navy-deep); color: var(--cream); }
  .lk { max-width: 440px; margin: 0 auto; padding-block: 40px 56px; padding-inline: var(--gut); display: grid; gap: 14px; text-align: center; }
  .lk-head { display: grid; justify-items: center; gap: 8px; margin-bottom: 10px; }
  .lk-head img { border-radius: 22px; }
  .lk-head h1 { font-family: var(--f-display); font-weight: 400; font-size: 2.2rem; line-height: 1; margin: 6px 0 0; color: var(--lime); }
  .lk-head p { margin: 0; max-width: none; font-family: var(--f-cond); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--cream-dim); }
  .lk a.btn { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; padding: 12px 18px; border-radius: 12px;
    background: var(--navy); border: 2px solid var(--navy-hi); color: var(--cream); text-decoration: none;
    font-family: var(--f-cond); font-weight: 700; font-size: 1.15rem; letter-spacing: .06em; text-transform: uppercase; }
  .lk a.btn:hover, .lk a.btn:focus-visible { border-color: var(--lime); }
  .lk a.btn:focus-visible { outline: 3px solid var(--lime); outline-offset: 3px; }
  .lk a.btn--main { background: var(--lime); border-color: var(--lime); color: var(--ink); box-shadow: 0 4px 0 var(--lime-deep); }
  .lk a.btn--main:hover, .lk a.btn--main:focus-visible { border-color: var(--cream); }
  .lk .sub { font: 500 .9rem/1.2 var(--f-body); letter-spacing: 0; color: var(--cream-dim); text-transform: none; }
  .lk-label { margin: 14px 0 0; font-family: var(--f-cond); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: .85rem; color: var(--cream-dim); }
  .lk-foot { margin: 18px auto 0; font-size: .95rem; color: var(--cream-dim); }
  .lk-foot a { color: var(--cream); }
</style>
